<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go — play online, vs computer or a friend · go.xcf.ai</title>
<meta name="description" content="Free online Go (baduk / weiqi) in the browser: play the computer, a friend on the same screen, or anyone online with a room link. 9×9, 13×13 and 19×19. Built by AgentiLoop Agent!.">
<meta property="og:title" content="Go · go.xcf.ai">
<meta property="og:description" content="Play Go online: vs computer, hot-seat or online multiplayer. Built by AgentiLoop Agent!.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="go.xcf.ai">
<meta property="og:url" content="https://go.xcf.ai/">
<meta property="og:image" content="https://go.xcf.ai/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Go board in the browser with black and white stones">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Go · go.xcf.ai">
<meta name="twitter:description" content="Play Go online: vs computer, hot-seat or online multiplayer. Built by AgentiLoop Agent!.">
<meta name="twitter:image" content="https://go.xcf.ai/og.png">
<meta name="twitter:image:alt" content="Go board in the browser with black and white stones">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%23111'/><circle cx='36' cy='36' r='12' fill='%23555'/></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/"><span class="stone b"></span><span class="stone w"></span> Go</a>
  <span class="by">by <a href="https://agentiloop.ai/#games" target="_blank" rel="noopener">AgentiLoop Agent!</a></span>
</header>

<main id="game" class="game">
  <div class="boardWrap"><canvas id="board"></canvas></div>
  <aside class="card side">
    <section class="panel-now">
      <div class="turn"><span id="turnDot" class="turn-dot b"></span><div><div id="status" class="status"></div><div id="mode" class="mode"></div></div></div>
      <div class="caps">
        <div class="cap"><span class="stone b"></span><div><b id="capB">0</b><small>captured by Black</small><i id="onB"></i></div></div>
        <div class="cap"><span class="stone w"></span><div><b id="capW">0</b><small>captured by White</small><i id="onW"></i></div></div>
      </div>
      <div class="btns">
        <button id="pass"><span>⏭</span>Pass</button>
        <button id="undo"><span>↶</span>Undo</button>
        <button id="resign" class="danger"><span>⚑</span>Resign</button>
        <button id="again" hidden><span>↻</span>Rematch</button>
      </div>
      <label class="chk"><input type="checkbox" id="showTerr"> Show area</label>
    </section>
    <section class="panel-new">
      <div class="panel-label">New game</div>
      <div class="tabs" id="modeSel"><button data-v="ai" class="on"><span>🤖</span>Computer</button><button data-v="local"><span>👥</span>2 Players</button><button data-v="online"><span>🌐</span>Online</button></div>
      <div class="seg" id="size"><button data-v="9">9×9</button><button data-v="13">13×13</button><button data-v="19" class="on">19×19</button></div>
      <div id="aiOpts" class="opts"><div class="seg" id="color"><button data-v="1" class="on">⚫ Black</button><button data-v="2">⚪ White</button></div></div>
      <div id="onlineOpts" class="opts" hidden><form id="joinForm"><input id="joinCode" maxlength="8" placeholder="Have a room code?" autocomplete="off"><button>Join</button></form></div>
      <button class="go" id="newGame">Start new game</button>
      <div class="share" id="share"><span class="share-ico">🔗</span><input id="shareLink" readonly placeholder="Pick Online to get an invite link"><button id="copy">Copy</button></div>
      <p class="rules">Area scoring, komi 6.5. Ko and suicide not allowed. Two passes end the game.</p>
    </section>
  </aside>
</main>

<footer class="foot">Made with <a href="https://agentiloop.ai" target="_blank" rel="noopener">AgentiLoop Agent!</a> · <a href="https://github.com/AgentiLoop/go.xcf.ai" target="_blank" rel="noopener">Source</a> · Also: <a href="https://chess.xcf.ai">chess.xcf.ai</a></footer>
<script type="module" src="/app.js"></script>
</body>
</html>
